[project]
name = "datagovuk-data-prototype"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click",
    "python-frontmatter",
    "python-slugify",
    "playwright",
    "jinja2>=3.1.6",
    "ruff>=0.15.8",
    "flask>=3.1.3",
    "flask-migrate>=4.1.0",
    "pgvector>=0.4.2",
    "python-dotenv>=1.2.2",
    "alembic-postgresql-enum>=1.10.0",
    "gunicorn>=26.0.0",
    "psycopg2-binary>=2.9.12",
    "markdown-it-py>=4.0.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.8",
]
search = [
    "torch>=2.11.0",
    "sentence-transformers>=5.4.1",
    "requests>=2.32.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["application"]
