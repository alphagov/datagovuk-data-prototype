{% if source %}
<section style="margin-top: 1.5rem">
    <h2>Source and notes</h2>
    {% if source.notes %}
    <p>{{ source.notes }}</p>
    {% endif %}
    <dl>
        {% if source['documentation-url'] %}
        <dt>Sourced from</dt>
        <dd>
            <a href="{{ source['documentation-url'] }}"
                >{{ source['documentation-url'] }}</a
            >
        </dd>
        {% endif %} {% if source['data-url'] %}
        <dt>Original data</dt>
        <dd>
            <a href="{{ source['data-url'] }}">{{ source['data-url'] }}</a>
        </dd>
        {% endif %}
    </dl>
</section>
{% endif %}
